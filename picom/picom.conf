#################################
#             Shadows           #
#################################
# Sombras debajo de las ventanas flotantes. Relativamente barato en GPU,
# se puede dejar activado sin mayor impacto.

shadow = true;

# Radio de difuminado de la sombra, en píxeles. Más alto = sombra más
# suave/grande pero más costosa de calcular. 7 es un valor moderado.
# Súbelo (ej. 12) si quieres sombras más "esponjosas"; bájalo (ej. 4)
# si quieres exprimir más rendimiento.
shadow-radius = 7;

# Desplazamiento de la sombra respecto a la ventana (X = horizontal,
# Y = vertical). Valores negativos la mueven hacia arriba-izquierda.
# Ajusta esto solo por estética, no afecta rendimiento.
shadow-offset-x = -7;
shadow-offset-y = -7;

# Ventanas que NUNCA deben tener sombra, sin importar lo demás.
# Aquí van típicamente: notificaciones, widgets flotantes tipo conky/
# relojes, y el frame extra que GTK agrega a algunas apps (needed para
# que no se vea una sombra rara alrededor del borde invisible de GTK).
shadow-exclude = [ "name = 'Notification'", "class_g = 'Conky'", "class_g ?= 'Notify-osd'", "class_g = 'Cairo-clock'", "_GTK_FRAME_EXTENTS@" ];


#################################
#           Fading              #
#################################
# Transición suave (fade in/out) al abrir/cerrar ventanas o cambiar
# opacidad, en vez de un cambio brusco instantáneo.

fading = true;

# Qué tanto cambia la opacidad por cada "paso" de animación al abrir/
# cerrar. Valores MÁS ALTOS = fade MÁS RÁPIDO (menos pasos = menos
# carga). Valores MÁS BAJOS = fade MÁS LENTO y suave (más pasos = más
# carga en CPU/GPU). 0.03 es un fade relativamente lento y suave.
# Si notas lag al abrir/cerrar ventanas, sube esto a 0.05-0.08.
fade-in-step = 0.03;
fade-out-step = 0.03;


#################################
#   Transparency / Opacity      #
#################################

# Opacidad de ventanas SIN foco (0.0 = invisible, 1.0 = opaca total).
# 0.92 es sutil, casi imperceptible, pero ayuda a distinguir a simple
# vista cuál ventana está activa. Bajarlo mucho (ej. 0.7) se ve más
# dramático pero cuesta más blending por frame.
inactive-opacity = 0.92;

# Opacidad de bordes/titlebar de ventana. 1.0 = sin transparencia en
# el frame (más barato). Si quieres que los bordes se vean semi-
# transparentes también, bájalo (ej. 0.8), pero cuesta procesamiento
# extra en cada frame — lo dejamos en 1.0 por rendimiento.
frame-opacity = 1.0;

# Si es true, la opacidad que definiste arriba (inactive-opacity)
# IGNORA cualquier opacidad que la propia app haya pedido vía
# '_NET_WM_WINDOW_OPACITY'. false = respeta lo que pida la app.
inactive-opacity-override = false;

# Ventanas que NUNCA deben considerarse "con foco" aunque técnicamente
# lo tengan (útil para widgets que no quieres que se vean "activos").
focus-exclude = [ "class_g = 'Cairo-clock'" ];


#################################
#           Corners             #
#################################
# Esquinas redondeadas en las ventanas (efecto puramente visual).

# 0 = DESACTIVADO. Cada esquina redondeada le cuesta a picom calcular
# una máscara extra en cada composición — en una iGPU vieja como la
# HD 4400 esto se nota. Si en el futuro quieres probarlo (con hardware
# nuevo, o simplemente porque te gusta el look), sube esto, ej: 8
corner-radius = 0;

# Qué tipos de ventana NUNCA deben tener esquinas redondeadas, aunque
# corner-radius esté activo. Dock (tu barra/polybar) y desktop deben
# quedar siempre cuadrados. Esta lista no hace nada mientras
# corner-radius = 0, pero la dejamos lista por si activas el radius.
rounded-corners-exclude = [ "window_type = 'dock'", "window_type = 'desktop'" ];


#################################
#     Background-Blurring       #
#################################
# NOTA IMPORTANTE: el blur de fondo (blur-background) está
# INTENCIONALMENTE DESACTIVADO en esta config. Es, de lejos, el efecto
# más caro que picom puede hacer, y en la iGPU Intel HD 4400 de tu
# ThinkPad se nota mucho: ventiladores más ruidosos, algo de lag al
# mover ventanas, y más consumo de batería.
#
# Si en el futuro cambias de equipo (o simplemente quieres probarlo
# para ver qué tanto te molesta), descomenta estas 3 líneas:
#
# blur-background = true;
# blur-method = "dual_kawase";   # método moderno, más eficiente que blur-kern
# blur-strength = 5;             # 1 (sutil) a 20 (muy difuminado)

# Qué tipos de ventana NUNCA deben tener blur de fondo, aunque
# actives blur-background arriba. Ya deja preparado dock/desktop
# excluidos para cuando lo actives.
blur-background-exclude = [ "window_type = 'dock'", "window_type = 'desktop'", "_GTK_FRAME_EXTENTS@" ];


#################################
#       General Settings        #
#################################

# Motor de renderizado. "glx" usa la GPU (vía OpenGL) para componer,
# descargando trabajo del CPU — mejor opción para tu i5-4200U de bajo
# consumo. La alternativa "xrender" hace el trabajo en CPU: más
# compatible con hardware muy viejo/raro, pero más lento en general.
# Si alguna vez ves glitches visuales raros (parpadeos, colores mal),
# es la primera bandera que probaría revertir a "xrender".
backend = "glx";

# Sincroniza el refresco con tu monitor para evitar "tearing" (líneas
# horizontales cortando la imagen al hacer scroll/mover ventanas
# rápido). Cuesta casi nada con backend glx, déjalo activado siempre.
vsync = true;

# Ayudan a picom a detectar mejor qué ventana está "enfocada"
# (afecta el cálculo de inactive-opacity/shadow). No tiene costo real
# en rendimiento, son solo heurísticas de detección — déjalos activados.
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Redibuja SOLO la parte de la pantalla que cambió, en vez de repintar
# todo el frame completo cada vez. Una de las optimizaciones MÁS
# IMPORTANTES que existen en picom — nunca lo desactives salvo que
# estés debuggeando artefactos visuales muy específicos.
use-damage = true;

# Nivel de detalle de los logs. "warn" = solo advertencias y errores
# importantes, sin inundar la terminal. Súbelo a "debug" o "trace"
# solo si estás debuggeando algo puntual (genera MUCHO texto).
log-level = "warn";


#################################
#         Window types          #
#################################
# Ajustes específicos por tipo de ventana (EWMH window types).

wintypes:
{
  # Tooltips (los globitos de ayuda al pasar el mouse): fade suave,
  # con sombra, semi-transparentes.
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };

  # Dock = tu barra (polybar/tray): sin sombra propia, y
  # clip-shadow-above evita que sombras de OTRAS ventanas se dibujen
  # ENCIMA de la barra (para que no se vea sucio el borde superior).
  dock = { shadow = false; clip-shadow-above = true; };

  # Drag & drop: sin sombra, se ve más limpio mientras arrastras algo.
  dnd = { shadow = false; };

  # Menús contextuales/desplegables: ligera transparencia, más rápidos
  # de renderizar que un menú 100% opaco con sombra completa.
  popup_menu = { opacity = 0.8; };
  dropdown_menu = { opacity = 0.8; };
};
